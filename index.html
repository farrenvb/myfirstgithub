<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player">
    <!-- Replace src below with your own image, e.g. "cover.jpg" -->
    <img class="cover" src="cover.jpg" alt="Album cover">

    <div class="track-info">
      <h1 id="song-title">All I Need Is Airpods</h1>
      <p id="song-artist">The Vincent</p>
    </div>

    <!-- Progress bar -->
    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="time-row">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="prev-btn" class="control-btn" aria-label="Previous">⏮</button>
      <button id="play-btn" class="control-btn play" aria-label="Play">▶</button>
      <button id="next-btn" class="control-btn" aria-label="Next">⏭</button>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
  </div>

  <!-- Replace src below with your own audio file, e.g. "song.mp3" -->
  <audio id="audio" src="song.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
